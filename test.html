<!DOCTYPE html>
<html>
<body>

<button id="login">
    Login with Google
</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyCaTflI5xJlba65xR765IGGsxQRuklbPys",
    authDomain: "misa-flask-api-501622.firebaseapp.com",
    projectId: "misa-flask-api-501622",
    storageBucket: "misa-flask-api-501622.firebasestorage.app",
    messagingSenderId: "725113220457",
    appId: "1:725113220457:web:310852a1c24829c7a021f8",
    measurementId: "G-F8ENPX0DYL"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

document.getElementById("login").onclick = async () => {

    try {

        const provider = new GoogleAuthProvider();

        const result = await signInWithPopup(
            auth,
            provider
        );

        const token = await result.user.getIdToken();

        console.log(
            "Firebase Token:",
            token
        );

        const response = await fetch(
            "http://localhost:5000/misa/auth/google",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    token
                })
            }
        );

        const data = await response.json();

        console.log(data);

    } catch (error) {

        console.error(error);

    }

};

</script>

</body>
</html>
